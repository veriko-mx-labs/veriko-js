name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  autoria:
    if: github.event_name != 'workflow_dispatch'
    uses: veriko-mx-labs/.github/.github/workflows/autoria.yml@eaaa2dca88eec1abbb98d75c8638290a28e0bbbb
    secrets:
      config: ${{ secrets.VERIKO_LABS_AUTORIA_CONFIG }}
  lint:
    name: Estilo, tipos y spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: prettier
        run: npm run format:check

      - name: tsc
        run: npm run typecheck

      - name: El spec versionado cumple el contrato de la API
        run: npm run check:spec-public

      - name: Los tipos generados están al día con el spec
        run: npm run check:types-fresh

      - name: Los ejemplos se analizan sin errores
        run: |
          node --check examples/validate.mjs
          node --check examples/async-and-webhooks.mjs
          node --check examples/express-webhook.mjs

  test:
    name: Pruebas (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci

      - run: npm test

  build:
    name: El paquete se consume en ESM y en CommonJS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run build

      - name: Empaquetar
        run: npm pack

      # Se instala el tarball en un proyecto aparte: así se comprueba lo que
      # recibe quien instala el paquete, no lo que hay en el árbol de trabajo.
      - name: Instalar el paquete en un proyecto de prueba
        run: |
          mkdir -p /tmp/consumo && cd /tmp/consumo
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/veriko-mx-sdk-*.tgz

      - name: Importar desde ESM
        working-directory: /tmp/consumo
        run: |
          node --input-type=module -e "
            import { Veriko, verifyWebhook, computeSignature, isSettled, SIGNATURE_HEADER } from '@veriko-mx/sdk';
            const firma = computeSignature('{}', 'sec');
            if (typeof Veriko !== 'function') throw new Error('Veriko no se exportó');
            if (typeof isSettled !== 'function') throw new Error('isSettled no se exportó');
            const client = new Veriko({ apiKey: 'veriko_prueba' });
            for (const [familia, metodo] of [['validations', 'waitFor'], ['webhooks', 'create'], ['catalog', 'banks'], ['beneficiaries', 'importWait'], ['usage', 'summary']]) {
              if (typeof client[familia][metodo] !== 'function') throw new Error(familia + '.' + metodo + ' no existe');
            }
            if (SIGNATURE_HEADER !== 'X-Webhook-Signature') throw new Error('cabecera inesperada');
            if (!verifyWebhook('{}', 'sha256=' + firma, 'sec')) throw new Error('la firma no cuadró');
            console.log('ESM correcto');
          "

      - name: Requerir desde CommonJS
        working-directory: /tmp/consumo
        run: |
          node --input-type=commonjs -e "
            const { Veriko, verifyWebhook, computeSignature, isSettled } = require('@veriko-mx/sdk');
            const firma = computeSignature('{}', 'sec');
            if (typeof Veriko !== 'function') throw new Error('Veriko no se exportó');
            if (typeof isSettled !== 'function') throw new Error('isSettled no se exportó');
            const client = new Veriko({ apiKey: 'veriko_prueba' });
            for (const [familia, metodo] of [['validations', 'waitFor'], ['webhooks', 'create'], ['catalog', 'banks'], ['beneficiaries', 'importWait'], ['usage', 'summary']]) {
              if (typeof client[familia][metodo] !== 'function') throw new Error(familia + '.' + metodo + ' no existe');
            }
            if (!verifyWebhook('{}', firma, 'sec')) throw new Error('la firma no cuadró');
            console.log('CommonJS correcto');
          "
