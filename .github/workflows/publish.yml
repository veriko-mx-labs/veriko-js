name: Publicar en npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm test

  build:
    name: Verificar y construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verificar la etiqueta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "La etiqueta $GITHUB_REF_NAME no coincide con la versión $version." >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "$GITHUB_REF_NAME")" origin/main

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:spec-public
      - run: npm run check:types-fresh
      - run: npm run build

      - name: Empaquetar y probar el artefacto
        shell: bash
        run: |
          mkdir package
          npm pack --pack-destination package
          mkdir /tmp/veriko-consumer
          cd /tmp/veriko-consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/package/veriko-mx-sdk-*.tgz
          node --input-type=module -e "import { Veriko } from '@veriko-mx/sdk'; if (typeof Veriko !== 'function') throw new Error('Veriko no se exportó')"
          node --input-type=commonjs -e "const { Veriko } = require('@veriko-mx/sdk'); if (typeof Veriko !== 'function') throw new Error('Veriko no se exportó')"

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    name: Publicar
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@veriko-mx/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package/

      - name: Publicar en npm
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          public_npmrc="$(mktemp)"
          publish_log="$(mktemp)"
          trap 'rm -f "$public_npmrc" "$publish_log"' EXIT

          if npm view "@veriko-mx/sdk@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
            echo "@veriko-mx/sdk@$version ya está publicado y es visible sin credenciales."
          else
            for attempt in 1 2 3 4; do
              if npm view "@veriko-mx/sdk@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
                echo "@veriko-mx/sdk@$version apareció publicado antes del reintento."
                break
              fi

              if npm publish ./package/*.tgz --access public >"$publish_log" 2>&1; then
                cat "$publish_log"
                break
              else
                status=$?
                cat "$publish_log" >&2
              fi

              if ! grep -Eiq \
                'E(429|500|502|503|504)|429 Too Many Requests|5(00|02|03|04) (Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout)|ECONNRESET|ETIMEDOUT|EAI_AGAIN' \
                "$publish_log"; then
                echo "npm publish falló con un error no transitorio; no se reintentará." >&2
                exit "$status"
              fi

              if [ "$attempt" -eq 4 ]; then
                echo "npm publish agotó los reintentos por errores transitorios." >&2
                exit "$status"
              fi

              delay=$((15 * 2 ** (attempt - 1)))
              echo "npm no está disponible temporalmente; reintento $((attempt + 1))/4 en ${delay}s..."
              sleep "$delay"
            done
          fi

          for attempt in 1 2 3 4 5 6; do
            if npm view "@veriko-mx/sdk@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
              echo "@veriko-mx/sdk@$version está disponible en el registro público."
              exit 0
            fi
            echo "Esperando propagación pública de npm ($attempt/6)..."
            sleep 5
          done

          echo "@veriko-mx/sdk@$version no es visible en npm sin credenciales." >&2
          exit 1

  release:
    name: Publicar las notas
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Extraer la entrada del changelog
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(
              rf'^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)',
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f'No existe una entrada para {version} en CHANGELOG.md')
          Path('release-notes.md').write_text(match.group('body').strip() + '\n', encoding='utf-8')
          PY

      - name: Crear la release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
