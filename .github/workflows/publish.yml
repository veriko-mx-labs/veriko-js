name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
      - run: npm test

  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Verify the tag
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the version $version." >&2
            exit 1
          fi
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "$GITHUB_REF_NAME")" origin/main

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:spec-public
      - run: npm run check:types-fresh
      - run: npm run build

      - name: Pack and test the artifact
        shell: bash
        run: |
          mkdir package
          npm pack --pack-destination package
          mkdir /tmp/veriko-consumer
          cd /tmp/veriko-consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/package/veriko-mx-sdk-*.tgz
          node --input-type=module -e "import { Veriko } from '@veriko-mx/sdk'; if (typeof Veriko !== 'function') throw new Error('Veriko was not exported')"
          node --input-type=commonjs -e "const { Veriko } = require('@veriko-mx/sdk'); if (typeof Veriko !== 'function') throw new Error('Veriko was not exported')"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/*.tgz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@veriko-mx/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package/

      - name: Publish to npm
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          public_npmrc="$(mktemp)"
          publish_log="$(mktemp)"
          trap 'rm -f "$public_npmrc" "$publish_log"' EXIT

          if npm view "@veriko-mx/sdk@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
            echo "@veriko-mx/sdk@$version is already published and visible without credentials."
          else
            for attempt in 1 2 3 4; do
              if npm view "@veriko-mx/sdk@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
                echo "@veriko-mx/sdk@$version appeared published before the retry."
                break
              fi

              if npm publish ./package/*.tgz --access public >"$publish_log" 2>&1; then
                cat "$publish_log"
                break
              else
                status=$?
                cat "$publish_log" >&2
              fi

              if ! grep -Eiq \
                'E(429|500|502|503|504)|429 Too Many Requests|5(00|02|03|04) (Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout)|ECONNRESET|ETIMEDOUT|EAI_AGAIN' \
                "$publish_log"; then
                echo "npm publish failed with a non-transient error; it will not be retried." >&2
                exit "$status"
              fi

              if [ "$attempt" -eq 4 ]; then
                echo "npm publish ran out of retries on transient errors." >&2
                exit "$status"
              fi

              delay=$((15 * 2 ** (attempt - 1)))
              echo "npm is temporarily unavailable; retry $((attempt + 1))/4 in ${delay}s..."
              sleep "$delay"
            done
          fi

          # The check avoids trusting a publication that npm accepted but did not make
          # visible. A version signed with provenance can take a few minutes to
          # appear, and npm itself warns "may take a few minutes": 24 x 15 s give six
          # minutes of margin.
          attempts_max=24
          for attempt in $(seq 1 "$attempts_max"); do
            if npm view "@veriko-mx/sdk@$version" version --userconfig "$public_npmrc" >/dev/null 2>&1; then
              echo "@veriko-mx/sdk@$version is available in the public registry."
              exit 0
            fi
            echo "Waiting for public npm propagation ($attempt/$attempts_max)..."
            sleep 15
          done


          echo "@veriko-mx/sdk@$version did not appear in the public registry after $((attempts_max * 15))s." >&2
          echo "If the log says '+ @veriko-mx/sdk@$version', the publication worked and this is propagation: rerun the job." >&2
          exit 1

  release:
    name: Publish the notes
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract the changelog entry
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION'].removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(
              rf'^## \[{re.escape(version)}\][^\n]*\n(?P<body>.*?)(?=^## \[|\Z)',
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f'There is no entry for {version} in CHANGELOG.md')
          Path('release-notes.md').write_text(match.group('body').strip() + '\n', encoding='utf-8')
          PY

      # The tarball is the same artifact that was published to npm, not one rebuilt
      # here: the `build` job produces it and both `publish` and this job consume it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package/

      - name: Create an ephemeral veriko-labs token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.VERIKO_LABS_APP_ID }}
          private-key: ${{ secrets.VERIKO_LABS_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md ./package/*.tgz
